<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Diamond Millennium</title>

<!-- PWA: manifest + ícone -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0053D8">
<link rel="icon" href="icon-192.png">

<!-- Suporte a "Adicionar à Tela de Início" no iPhone/Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diamond">
<link rel="apple-touch-icon" href="icon-192.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --azul: #0053D8;
    --azul-escuro: #063593;
    --verde: #2F9E44;
    --fundo: #f7f7f8;
    --borda: #e2e2e6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--fundo);
    overscroll-behavior: none;
    /* Trava a rolagem da página inteira — só o conteúdo de dentro de cada
       ferramenta (dentro do iframe) deve rolar. Sem isso, em alguns
       navegadores a própria página do app.html conseguia rolar um pouco,
       arrastando junto o cabeçalho e a barra de sub-abas de ferramentas
       como o Diário de Obra — que são "sticky" só *dentro* do iframe de
       cada uma, então rolagem *fora* do iframe não é o que elas esperam
       (2026-09-23, bug real reportado pelo usuário). */
    overflow: hidden;
  }

  /* ===================== TELA DE LOGIN / CADASTRO ===================== */
  #telaLogin {
    position: fixed; inset: 0;
    background: linear-gradient(160deg, var(--azul-escuro), var(--azul) 65%);
    display: flex; flex-direction: column; align-items: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top));
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    z-index: 50;
    /* A tela de login/cadastro precisa poder rolar por dentro dela mesma —
       com o formulário de cadastro aberto (mais campos que o de login), o
       cartão fica mais alto que a tela em celulares menores. Como o
       html/body ficou travado (overflow:hidden, correção da barra do
       Diário de Obra logo acima), sem isso aqui o cadastro ficava
       "preso", sem jeito de rolar até o resto dos campos/botão
       (2026-09-23, bug real reportado pelo usuário). */
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  /* Truque do "espaçador flexível" pra centralizar o cartão verticalmente
     SÓ quando ele cabe na tela — se centralizasse com "justify-content:
     center" direto (jeito mais comum), em telas onde o cartão de cadastro
     fica mais alto que a tela, os navegadores empurram o topo do cartão
     pra fora da área visível SEM dar jeito de rolar até lá (um bug
     conhecido de centralização com flexbox + conteúdo maior que a tela).
     Esses dois espaçadores em branco (vazios, então começam com 0px)
     crescem igualmente pra "empurrar" o cartão pro meio quando sobra
     espaço, mas nunca ficam negativos — então quando o cartão não cabe,
     eles simplesmente encolhem a 0 e o cartão começa coladinho no topo,
     100% alcançável rolando pra baixo (2026-09-23, mesma correção do bug
     relatado do cadastro "travado"). */
  #telaLogin::before, #telaLogin::after {
    content: ""; flex: 1 0 auto; width: 100%;
  }
  #telaLogin.escondida { display: none; }
  .cartaoLogin {
    background: #fff;
    border-radius: 20px;
    width: 100%;
    max-width: 360px;
    padding: 28px 24px 24px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.25);
  }
  .cartaoLogin .logo {
    display: block;
    width: 72px; height: 72px;
    margin: 0 auto 14px;
    object-fit: contain;
  }
  .cartaoLogin h1 {
    margin: 0 0 4px; text-align: center;
    font-size: 19px; font-weight: 800; color: var(--azul-escuro);
  }
  .cartaoLogin p.legenda {
    margin: 0 0 20px; text-align: center;
    font-size: 12.5px; color: #8a8a92;
  }
  .campo { margin-bottom: 12px; }
  .campo label {
    display: block; font-size: 12px; font-weight: 700;
    color: #55555c; margin-bottom: 5px;
  }
  .campo input {
    width: 100%; padding: 11px 12px;
    border: 1.5px solid var(--borda); border-radius: 10px;
    font-size: 15px; font-family: inherit;
    background: #fafafa;
  }
  .campo input:focus { outline: none; border-color: var(--azul); background: #fff; }
  .btnPrincipal {
    width: 100%; padding: 12px;
    background: var(--azul); color: #fff;
    border: none; border-radius: 10px;
    font-size: 15px; font-weight: 700; font-family: inherit;
    cursor: pointer; margin-top: 4px;
  }
  .btnPrincipal:disabled { opacity: .6; }
  .btnLink {
    display: block; width: 100%; text-align: center;
    background: none; border: none;
    color: var(--azul); font-family: inherit;
    font-size: 13px; font-weight: 700;
    padding: 12px 4px 2px; cursor: pointer;
  }
  #erroLogin {
    min-height: 16px; font-size: 12.5px; color: #c0392b;
    text-align: center; margin-top: 4px;
  }
  #boxCadastro { display: none; border-top: 1px solid var(--borda); margin-top: 14px; padding-top: 14px; }
  #boxCadastro.mostrar { display: block; }
  #boxCadastro h2 { margin: 0 0 12px; font-size: 14px; color: var(--azul-escuro); }

  /* ===================== CASCA DO APP ===================== */
  /* Tudo (cabeçalho + abas + conteúdo) numa coluna flex só, ocupando a
     tela inteira — o cabeçalho e a faixa de abas ficam juntos, coladinhos,
     como um "cabeçalho só" (pedido do usuário, 2026-09-23), e o conteúdo
     ocupa o resto sozinho, sem precisar calcular alturas fixas na mão. */
  #appShell { display: none; }
  #appShell.visivel {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    overflow: hidden;
  }

  #cabecalho {
    flex: 0 0 auto;
    background: linear-gradient(120deg, var(--azul-escuro), var(--azul));
    color: #fff;
    padding-top: env(safe-area-inset-top);
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    z-index: 20;
  }

  #topo {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    padding: 6px 10px 4px;
  }
  #topo .marca { display: flex; align-items: center; gap: 8px; min-width: 0; }
  /* a logo é um PNG com fundo preto sólido (não transparente) — em vez de
     mostrar essa "marca preta" quadrada em cima do azul do cabeçalho,
     "screen" faz o preto sumir (vira o próprio fundo azul por trás) e
     deixa só o desenho/escrito branco aparecendo, como se fosse recortado
     (2026-09-23, pedido do usuário). */
  #topo .marca img { height: 22px; width: auto; flex-shrink: 0; mix-blend-mode: screen; }
  #topo .saudacao {
    font-weight: 700; font-size: 13px; line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #topo .saudacao small { display: block; font-weight: 500; font-size: 9.5px; opacity: .8; }
  #btnSairShell {
    background: rgba(255,255,255,0.16);
    border: none; color: #fff;
    font-family: inherit; font-size: 11.5px; font-weight: 700;
    padding: 6px 11px; border-radius: 18px;
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  /* Faixa de abas — agora dentro do próprio cabeçalho, em vez de uma barra
     grande fixada embaixo. Rolagem horizontal (em vez de espremer/quebrar)
     evita que alguma aba "saia da tela" quando não cabem todas de uma vez
     (ex.: usuário admin, com a aba extra "Admin" visível). */
  #abas {
    display: flex; align-items: center;
    gap: 6px;
    padding: 2px 8px 8px;
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #abas::-webkit-scrollbar { display: none; }
  .aba {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,0.12);
    border: none; border-radius: 16px;
    color: rgba(255,255,255,0.8);
    font-family: inherit;
    padding: 7px 12px;
    cursor: pointer; white-space: nowrap;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .aba .icone { font-size: 14px; line-height: 1; }
  .aba .rotulo { font-size: 11.5px; line-height: 1; font-weight: 700; }
  .aba.selecionada { background: #fff; color: var(--azul-escuro); }
  .aba.escondida { display: none; }

  #conteudo {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    background: #fff;
    overflow: hidden;
  }
  #conteudo iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: none;
    background: #fff;
    display: none;
  }
  #conteudo iframe.ativo { display: block; }
  #placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #888; font-size: 14px; text-align: center; padding: 24px;
  }
  #placeholder.escondido { display: none; }

  @media (min-width: 700px) {
    #topo .marca img { height: 26px; }
    #topo .saudacao { font-size: 14px; }
    .aba .rotulo { font-size: 12px; }
  }

  /* aviso que aparece brevemente quando uma escrita é bloqueada (modo
     somente leitura ligado pelo administrador) — ver aplicarBloqueioLeitura */
  #avisoSomenteLeitura {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 16px);
    transform: translateX(-50%) translateY(10px);
    background: #1c1c1c; color: #fff; font-size: 12.5px; font-weight: 600;
    padding: 10px 16px; border-radius: 20px; z-index: 40;
    opacity: 0; pointer-events: none; transition: .2s;
    max-width: 85vw; text-align: center;
  }
  #avisoSomenteLeitura.mostrar { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <!-- ===================== TELA DE LOGIN / CADASTRO ===================== -->
  <div id="telaLogin">
    <div class="cartaoLogin">
      <img class="logo" src="icon-512.png" alt="Diamond Millennium">
      <h1>Diamond Millennium</h1>
      <p class="legenda">Entre com seu usuário para acessar o app</p>

      <div class="campo">
        <label>Usuário</label>
        <input id="loginUser" type="text" autocomplete="username" placeholder="seu usuário">
      </div>
      <div class="campo">
        <label>Senha</label>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="sua senha">
      </div>
      <div id="erroLogin"></div>
      <button class="btnPrincipal" id="btnEntrar" onclick="doLogin()">Entrar</button>
      <button class="btnLink" onclick="toggleCadastro()">Não tem conta? Cadastre-se</button>

      <div id="boxCadastro">
        <h2>Criar minha conta</h2>
        <div class="campo">
          <label>Nome completo</label>
          <input id="cadNome" type="text" placeholder="seu nome">
        </div>
        <div class="campo">
          <label>Usuário</label>
          <input id="cadLogin" type="text" autocomplete="username" placeholder="escolha um usuário">
        </div>
        <div class="campo">
          <label>Senha</label>
          <input id="cadSenha" type="password" autocomplete="new-password" placeholder="mínimo 4 caracteres">
        </div>
        <div class="campo">
          <label>Confirme a senha</label>
          <input id="cadSenhaConfirma" type="password" autocomplete="new-password" placeholder="repita a senha">
        </div>
        <button class="btnPrincipal" id="btnCadastrar" onclick="cadastrarUsuario()">Criar conta e entrar</button>
        <button class="btnLink" onclick="toggleCadastro()">Já tenho conta, voltar ao login</button>
      </div>
    </div>
  </div>

<script>
  // Registra o service worker (permite instalar como app / abrir mais rápido).
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {
        // Se falhar (ex.: abrindo direto de um arquivo local, sem servidor),
        // o app continua funcionando normal, só sem o recurso de instalar.
      });
    });
  }

  // ============================================================
  // LOGIN ÚNICO DO APP (conta individual — tabela usuarios_diario,
  // já usada pelo Diário de Obra). Ao entrar aqui, gravamos as DUAS
  // chaves de sessão que as 6 ferramentas já sabem ler, então nenhuma
  // delas pede login de novo — elas simplesmente já abrem liberadas.
  // ============================================================
  const OBRA_ID = 'diamond_millennium';
  const SUPABASE_URL = 'https://otlzehasidzannsczcnv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_EsUxMlHlz4XiUjso5Yit-g_vtl7_Ius';

  let sb = null;
  try {
    if (window.supabase) {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true }
      });
    }
  } catch (e) { console.error('Falha ao iniciar Supabase:', e); }

  const memStore = {};
  function safeGet(key) {
    const k = `${OBRA_ID}:${key}`;
    try { return localStorage.getItem(k); } catch (e) { return memStore[k] ?? null; }
  }
  function safeSet(key, value) {
    const k = `${OBRA_ID}:${key}`;
    try { localStorage.setItem(k, value); } catch (e) { memStore[k] = value; }
  }
  function safeRemove(key) {
    const k = `${OBRA_ID}:${key}`;
    try { localStorage.removeItem(k); } catch (e) { delete memStore[k]; }
  }

  let usuarioAtual = null;

  function toggleCadastro() {
    document.getElementById('boxCadastro').classList.toggle('mostrar');
    document.getElementById('erroLogin').textContent = '';
  }

  async function doLogin() {
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('erroLogin');
    errEl.textContent = '';
    if (!user || !pass) { errEl.textContent = '❌ Preencha usuário e senha.'; return; }
    if (!sb) { errEl.textContent = '⚠️ Sem conexão com o banco.'; return; }
    const btn = document.getElementById('btnEntrar');
    btn.disabled = true; btn.textContent = 'Entrando...';
    try {
      const { data, error } = await sb.from('usuarios_diario')
        .select('id, nome, login, senha, ativo, paginas_permitidas')
        .ilike('login', user)
        .maybeSingle();
      if (error) throw error;
      if (!data || !data.ativo || data.senha !== pass) {
        errEl.textContent = '❌ Usuário ou senha inválidos.';
        return;
      }
      entrarComUsuario({ id: data.id, nome: data.nome, login: data.login, paginas_permitidas: data.paginas_permitidas });
      document.getElementById('loginUser').value = '';
      document.getElementById('loginPassword').value = '';
    } catch (e) {
      errEl.textContent = '⚠️ Erro ao entrar: ' + (e.message || e);
    } finally {
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  }

  async function cadastrarUsuario() {
    const nome = document.getElementById('cadNome').value.trim();
    const loginDesejado = document.getElementById('cadLogin').value.trim().toLowerCase().replace(/\s+/g, '');
    const senha = document.getElementById('cadSenha').value;
    const senhaConfirma = document.getElementById('cadSenhaConfirma').value;
    const errEl = document.getElementById('erroLogin');
    errEl.textContent = '';
    if (!nome) { errEl.textContent = '❌ Digite seu nome.'; return; }
    if (!loginDesejado) { errEl.textContent = '❌ Escolha um usuário.'; return; }
    if (!senha || senha.length < 4) { errEl.textContent = '❌ A senha precisa ter pelo menos 4 caracteres.'; return; }
    if (senha !== senhaConfirma) { errEl.textContent = '❌ As senhas digitadas são diferentes.'; return; }
    if (!sb) { errEl.textContent = '⚠️ Sem conexão com o banco.'; return; }
    const btn = document.getElementById('btnCadastrar');
    btn.disabled = true; btn.textContent = 'Criando...';
    try {
      const { data: existente, error: errCheck } = await sb.from('usuarios_diario')
        .select('id').ilike('login', loginDesejado).maybeSingle();
      if (errCheck) { errEl.textContent = '⚠️ Erro ao verificar usuário: ' + errCheck.message; return; }
      if (existente) { errEl.textContent = '❌ Esse usuário já existe — escolha outro.'; return; }
      const { data, error } = await sb.from('usuarios_diario')
        .insert({ nome, login: loginDesejado, senha, ativo: true }).select().single();
      if (error) { errEl.textContent = '⚠️ Erro ao cadastrar: ' + error.message; return; }
      document.getElementById('cadNome').value = '';
      document.getElementById('cadLogin').value = '';
      document.getElementById('cadSenha').value = '';
      document.getElementById('cadSenhaConfirma').value = '';
      document.getElementById('boxCadastro').classList.remove('mostrar');
      entrarComUsuario({ id: data.id, nome: data.nome, login: data.login, paginas_permitidas: data.paginas_permitidas });
    } finally {
      btn.disabled = false; btn.textContent = 'Criar conta e entrar';
    }
  }

  function entrarComUsuario(u) {
    usuarioAtual = u;
    // Grava as duas chaves de sessão que as ferramentas antigas já leem:
    // "usuario_atual" (Diário de Obra) e "logged_in" (as outras 5 telas).
    safeSet('usuario_atual', JSON.stringify(u));
    safeSet('logged_in', 'true');
    mostrarApp();
  }

  function doLogoutShell() {
    safeRemove('usuario_atual');
    safeRemove('logged_in');
    usuarioAtual = null;
    document.getElementById('appShell').classList.remove('visivel');
    document.getElementById('telaLogin').classList.remove('escondida');
  }

  function checkSessaoExistente() {
    const raw = safeGet('usuario_atual');
    if (!raw) return;
    try {
      const u = JSON.parse(raw);
      if (u && u.id) { usuarioAtual = u; mostrarApp(); }
    } catch (e) { safeRemove('usuario_atual'); }
  }

  function ehAdmin() {
    return !!(usuarioAtual && (usuarioAtual.login || '').toLowerCase() === 'junior');
  }

  function mostrarApp() {
    document.getElementById('telaLogin').classList.add('escondida');
    document.getElementById('appShell').classList.add('visivel');
    const el = document.getElementById('saudacaoTopo');
    if (el && usuarioAtual) el.innerHTML = 'Olá, ' + usuarioAtual.nome.split(' ')[0] + '<small>Diamond Millennium</small>';
    // a aba "Admin" só aparece pro login "junior" — pras outras pessoas nem
    // existe na barra de abas (mesmo nível "decorativo" de proteção do
    // resto do sistema, não é uma barreira de segurança real)
    document.getElementById('abaAdmin').classList.toggle('escondida', !ehAdmin());
    aplicarPermissoesAbas();
    iniciarAbas();
    carregarConfigPaginas();
    if (!pollConfigId) pollConfigId = setInterval(carregarConfigPaginas, 30000);
  }

  // ============================================================
  // ABAS (mesma lógica de antes — só passa a rodar depois do login)
  // ============================================================
  const botoes = document.querySelectorAll('.aba');
  const placeholder = document.getElementById('placeholder');
  const mapaFrame = {
    presenca: document.getElementById('frame-presenca'),
    equipes: document.getElementById('frame-equipes'),
    diario: document.getElementById('frame-diario'),
    dashboard: document.getElementById('frame-dashboard'),
    semanal: document.getElementById('frame-semanal'),
    boletim: document.getElementById('frame-boletim'),
    rh: document.getElementById('frame-rh'),
    admin: document.getElementById('frame-admin'),
  };
  // só essas 7 podem ser travadas em "somente leitura" e restringidas por
  // pessoa pelo admin.html — a aba "admin" nunca entra nessa lista (ela é
  // o próprio controle)
  const PAGINAS_TRAVAVEIS = ['presenca', 'equipes', 'diario', 'dashboard', 'semanal', 'boletim', 'rh'];

  // CSS injetado em cada ferramenta (mesma origem) assim que ela carrega,
  // só pra tirar a marca "Diamond Millennium" repetida (já aparece uma vez
  // lá em cima, no app, com o cabeçalho novo e compacto de 2026-09-23) e o
  // botão "Sair" de cada tela (o app agora tem um único botão Sair, lá em
  // cima). Desde 2026-09-23 também encolhe a barra de cada ferramenta pra
  // sobrar mais tela pro conteúdo de verdade no celular — some com a logo
  // e o título repetidos, mas mantém qualquer botão de ação que a
  // ferramenta já tinha ali (ex.: 🔄 do Equipes, 📄 Exportar PDF do
  // Painel), então nada funcional quebra.
  const CSS_UNIFICACAO = `
    @media screen {
      .head .sub { display: none !important; }
      .head img { display: none !important; }
      .head h1 { display: none !important; }
      .head {
        padding: 6px 10px !important; min-height: 0 !important;
        background: #fff !important; border-bottom: none !important;
        box-shadow: 0 1px 0 rgba(0,0,0,0.08) !important;
      }
    }
    .head button[onclick="doLogout()"] { display: none !important; }
  `;

  function ligarUnificacao(frame, chave) {
    frame.addEventListener('load', () => {
      try {
        const doc = frame.contentDocument;
        if (!doc) return;
        const style = doc.createElement('style');
        style.textContent = CSS_UNIFICACAO;
        doc.head.appendChild(style);
        // Se a pessoa clicar em "Sair" de dentro de alguma aba (caso o
        // botão não tenha sido pego pelo CSS acima), faz o logout valer
        // pro app inteiro, não só pra aquela aba.
        if (frame.contentWindow) {
          frame.contentWindow.doLogout = doLogoutShell;
        }
        // Algumas ferramentas (hoje só o Diário de Obra) têm uma 2ª barra
        // fixa logo abaixo do cabeçalho (".tabs", com as sub-abas Novo
        // registro/Por funcionário/etc.), que já vinha com um
        // "position:sticky; top:56px" fixo, calculado pro cabeçalho antigo
        // (mais alto) daquela tela sozinha. Como o CSS acima encolheu o
        // cabeçalho, a distância mudou — sem corrigir aqui, essa 2ª barra
        // ficava "flutuando" fora do lugar (2026-09-23, reportado pelo
        // usuário). Em vez de cravar um número novo, mede a altura real do
        // cabeçalho já encolhido e ajusta o "top" da barra pra colar
        // certinho embaixo dele, com fundo sólido (não transparente) pra
        // não deixar o conteúdo que rola por baixo aparecer por cima.
        const ajustarSegundaBarra = () => {
          const cabecalhoFerramenta = doc.querySelector('.head');
          const segundaBarra = doc.querySelector('.tabs');
          if (!cabecalhoFerramenta || !segundaBarra) return;
          const altura = cabecalhoFerramenta.getBoundingClientRect().height;
          if (altura > 0) segundaBarra.style.setProperty('top', altura + 'px', 'important');
        };
        requestAnimationFrame(() => requestAnimationFrame(ajustarSegundaBarra));
      } catch (e) {
        // ferramenta ainda não carregou / sem acesso — ignora
      }
      aplicarBloqueioLeitura(frame, chave);
    });
  }
  Object.entries(mapaFrame).forEach(([chave, frame]) => ligarUnificacao(frame, chave));

  // ============================================================
  // PAINEL ADMINISTRATIVO — bloqueio de "somente leitura" por ferramenta
  // (2026-09-23). O admin (login "junior") liga/desliga isso pelo admin.html,
  // que grava numa tabela (app_paginas_config). Aqui a gente só lê essa
  // tabela e, se uma ferramenta estiver travada, troca o "fetch" de dentro
  // daquele iframe (mesma origem, acesso direto) pra bloquear só os pedidos
  // de ESCRITA pro Supabase (POST/PATCH/PUT/DELETE) — leitura continua 100%
  // normal, e a tela inteira continua clicável, então quem tentar salvar
  // algo recebe o mesmo aviso de erro que a ferramenta já mostra quando o
  // Supabase recusa alguma coisa (não precisou mexer em nenhuma das 6
  // ferramentas pra isso funcionar). O admin (junior) nunca é bloqueado nas
  // próprias ferramentas, só os outros usuários.
  // ============================================================
  let configPaginas = {};
  let pollConfigId = null;

  async function carregarConfigPaginas() {
    if (!sb) return;
    try {
      const { data, error } = await sb.from('app_paginas_config').select('pagina, somente_leitura');
      if (error) throw error;
      const novoConfig = {};
      (data || []).forEach((r) => { novoConfig[r.pagina] = !!r.somente_leitura; });
      configPaginas = novoConfig;
    } catch (e) {
      // tabela pode ainda não existir (admin_painel_setup.sql não rodado) —
      // nesse caso simplesmente não trava nada, sem quebrar o app
    }
    // também busca de novo as permissões por pessoa (quais abas essa pessoa
    // pode ver) direto do banco — assim uma restrição nova feita pelo admin
    // no admin.html passa a valer sozinha, sem a pessoa precisar sair e
    // entrar de novo. Não se aplica ao admin, que sempre vê tudo.
    if (usuarioAtual && !ehAdmin()) {
      try {
        const { data: dataUser, error: errUser } = await sb.from('usuarios_diario')
          .select('paginas_permitidas').eq('id', usuarioAtual.id).maybeSingle();
        if (!errUser && dataUser) {
          usuarioAtual.paginas_permitidas = dataUser.paginas_permitidas;
          safeSet('usuario_atual', JSON.stringify(usuarioAtual));
        }
      } catch (e2) {
        // coluna pode ainda não existir (admin_permissoes_setup.sql não
        // rodado) — nesse caso mantém a última permissão conhecida (ou
        // "acesso a tudo" por padrão), sem quebrar o app
      }
    }
    aplicarPermissoesAbas();
    // reaplica o bloqueio (ou libera) em qualquer aba que já esteja aberta,
    // sem precisar recarregar a página
    PAGINAS_TRAVAVEIS.forEach((chave) => {
      const frame = mapaFrame[chave];
      if (frame && frame.getAttribute('src')) aplicarBloqueioLeitura(frame, chave);
    });
  }

  // ============================================================
  // PERMISSÕES POR PESSOA — quais das 6 ferramentas cada pessoa pode
  // acessar (2026-09-23). Controlado pelo admin no admin.html, seção
  // "👤 Permissões por pessoa" (grava em usuarios_diario.paginas_permitidas:
  // null = acesso a tudo, que é o padrão pra ninguém perder acesso à toa;
  // uma lista tipo ["presenca"] restringe só àquelas). O admin (junior)
  // nunca é restringido, sempre vê as 6. Isso só esconde a aba na barra —
  // mesmo nível "decorativo" de proteção do resto do login deste projeto,
  // não impede alguém de abrir o arquivo da ferramenta direto por fora do
  // app (isso exigiria mexer dentro de cada uma das 6 ferramentas).
  // ============================================================
  function aplicarPermissoesAbas() {
    const permitidas = ehAdmin() ? null : (usuarioAtual && usuarioAtual.paginas_permitidas);
    PAGINAS_TRAVAVEIS.forEach((chave) => {
      const btn = document.querySelector(`.aba[data-aba="${chave}"]`);
      if (!btn) return;
      const liberado = !permitidas || permitidas.includes(chave);
      btn.classList.toggle('escondida', !liberado);
    });
    // se a aba selecionada no momento acabou de ficar escondida (restrição
    // aplicada com a pessoa já usando o app), troca sozinho pra primeira
    // aba ainda liberada, pra não deixar a tela travada numa ferramenta
    // que sumiu da barra
    const abaAtivaBtn = document.querySelector('.aba.selecionada');
    if (abasIniciadas && abaAtivaBtn && abaAtivaBtn.classList.contains('escondida')) {
      const primeiraLiberada = Array.from(document.querySelectorAll('.aba'))
        .find((b) => !b.classList.contains('escondida'));
      if (primeiraLiberada) abrirAba(primeiraLiberada.dataset.aba);
    }
  }

  function avisarBloqueioLeitura() {
    const aviso = document.getElementById('avisoSomenteLeitura');
    if (!aviso) return;
    aviso.textContent = '🔒 Essa ferramenta está em modo somente leitura no momento.';
    aviso.classList.add('mostrar');
    clearTimeout(avisarBloqueioLeitura._t);
    avisarBloqueioLeitura._t = setTimeout(() => aviso.classList.remove('mostrar'), 3000);
  }

  function aplicarBloqueioLeitura(frame, chave) {
    if (!PAGINAS_TRAVAVEIS.includes(chave)) return;
    let win;
    try { win = frame.contentWindow; } catch (e) { return; }
    if (!win || !win.fetch) return;

    const devesTravar = !!configPaginas[chave] && !ehAdmin();

    if (devesTravar) {
      if (win.__somenteLeituraAplicado) return; // já travado
      const fetchOriginal = win.fetch.bind(win);
      win.__fetchOriginalAntesDoBloqueio = fetchOriginal;
      win.fetch = function (url, opcoes) {
        const metodo = ((opcoes && opcoes.method) || 'GET').toUpperCase();
        const ehSupabase = typeof url === 'string' && url.indexOf('supabase.co') !== -1;
        const ehEscrita = ['POST', 'PATCH', 'PUT', 'DELETE'].indexOf(metodo) !== -1;
        if (ehSupabase && ehEscrita) {
          avisarBloqueioLeitura();
          const corpoErro = JSON.stringify({
            message: 'Somente leitura: edição bloqueada pelo administrador.',
            details: null, hint: null, code: '423',
          });
          try {
            return Promise.resolve(new win.Response(corpoErro, {
              status: 423,
              headers: { 'Content-Type': 'application/json' },
            }));
          } catch (e2) {
            // fallback bem raro (Response indisponível no realm do iframe)
            return Promise.reject(new Error('Somente leitura: edição bloqueada pelo administrador.'));
          }
        }
        return fetchOriginal(url, opcoes);
      };
      win.__somenteLeituraAplicado = true;
    } else if (win.__somenteLeituraAplicado) {
      // foi destravado (ou virou admin) — restaura o fetch original
      if (win.__fetchOriginalAntesDoBloqueio) win.fetch = win.__fetchOriginalAntesDoBloqueio;
      win.__somenteLeituraAplicado = false;
    }
  }

  function abrirAba(nome) {
    botoes.forEach((b) => b.classList.toggle('selecionada', b.dataset.aba === nome));
    Object.entries(mapaFrame).forEach(([chave, frame]) => {
      if (chave === nome) {
        if (!frame.getAttribute('src')) {
          frame.setAttribute('src', frame.dataset.src);
        }
        frame.classList.add('ativo');
      } else {
        frame.classList.remove('ativo');
      }
    });
    placeholder.classList.add('escondido');
    try { localStorage.setItem('diamond_app_ultima_aba', nome); } catch (e) {}
  }

  botoes.forEach((b) => b.addEventListener('click', () => abrirAba(b.dataset.aba)));

  let abasIniciadas = false;
  function iniciarAbas() {
    if (abasIniciadas) return;
    abasIniciadas = true;
    let abaInicial = 'presenca';
    try {
      const salva = localStorage.getItem('diamond_app_ultima_aba');
      if (salva && mapaFrame[salva]) abaInicial = salva;
    } catch (e) {}
    // se a aba escolhida (a última usada, ou "presenca" por padrão) estiver
    // escondida por causa de uma restrição de permissão, abre a primeira
    // aba que essa pessoa realmente pode ver
    const btnInicial = document.querySelector(`.aba[data-aba="${abaInicial}"]`);
    if (!btnInicial || btnInicial.classList.contains('escondida')) {
      const primeiraVisivel = Array.from(document.querySelectorAll('.aba'))
        .find((b) => !b.classList.contains('escondida'));
      if (primeiraVisivel) abaInicial = primeiraVisivel.dataset.aba;
    }
    abrirAba(abaInicial);
  }

  checkSessaoExistente();
</script>

</body>
