<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gestão de Equipes - Diamond Millennium</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --charcoal:#063593;
    --yellow:#0053D8;
    --green:#2F9E44;
    --orange:#E8590C;
    --teal:#4ECDC4;
    --concrete:#F1F0F3;
    --brand-graylight:#B1AEB5;
    --brand-graymid:#585759;
    --brand-black:#1C1C1C;
    --safe-t:env(safe-area-inset-top, 0px);
    --safe-b:env(safe-area-inset-bottom, 0px);
    --safe-l:env(safe-area-inset-left, 0px);
    --safe-r:env(safe-area-inset-right, 0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{font-family:"Segoe UI",Arial,Helvetica,sans-serif;background:var(--concrete);color:var(--brand-black);font-size:15px;line-height:1.4;padding-bottom:calc(24px + var(--safe-b));}
  button, select{touch-action:manipulation;}

  /* ---------- login ---------- */
  .login-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--charcoal);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .login-screen.hidden{display:none;}
  .login-box{background:#fff;padding:26px 22px;border-radius:14px;width:100%;max-width:340px;}
  .login-box h1{font-size:19px;margin-bottom:18px;text-align:center;}
  .login-box input{width:100%;padding:13px 14px;border:1px solid #ddd;border-radius:9px;margin-bottom:12px;font-size:16px;}
  .login-box button{width:100%;padding:13px;background:var(--yellow);color:#fff;border:none;border-radius:9px;font-weight:600;cursor:pointer;font-size:15px;min-height:46px;}
  .login-box .error{color:var(--orange);font-size:12px;margin-bottom:10px;text-align:center;font-weight:600;}

  /* ---------- cabeçalho (fixo no topo, respeitando notch) ---------- */
  .head{background:var(--charcoal);color:#fff;padding:calc(12px + var(--safe-t)) calc(14px + var(--safe-r)) 12px calc(14px + var(--safe-l));border-bottom:4px solid var(--yellow);display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:20;}
  .head .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .head img{height:30px;width:auto;flex-shrink:0;}
  .head h1{font-size:15px;font-weight:600;line-height:1.2;}
  .head .sub{font-size:10.5px;opacity:0.75;margin-top:2px;line-height:1.2;}
  .head .actions{display:flex;gap:6px;flex-shrink:0;}
  .head button{background:#ffffff26;color:#fff;border:none;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;min-height:38px;}
  .head .btn-refresh{background:var(--yellow);}

  /* ---------- busca ---------- */
  .filters{padding:12px 14px;background:#fff;border-bottom:1px solid #ddd;}
  .filters input{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:10px;font-size:16px;min-height:46px;}
  .filters .hint{font-size:11px;opacity:0.6;margin-top:6px;line-height:1.3;}

  .content{padding:14px;max-width:1100px;margin:0 auto;}

  /* ---------- tiles de resumo ---------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit, minmax(110px, 1fr));gap:8px;margin-bottom:18px;}
  .card{background:#fff;border:1px solid #ddd;border-top:3px solid var(--yellow);border-radius:10px;padding:12px 8px;text-align:center;}
  .card.warn{border-top-color:#B00020;}
  .card .n{font-size:21px;font-weight:700;}
  .card .l{font-size:10.5px;opacity:0.65;margin-top:3px;}
  /* tiles de resumo que também servem de atalho — toque pula direto pra seção,
     sem precisar rolar a lista toda pra chegar lá */
  .card.jump{cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .card.jump:active{transform:scale(0.95);}

  @keyframes secFlash{0%{background:#FFF3C4;}100%{background:transparent;}}
  .team-section.just-jumped summary{animation:secFlash 1.1s ease;}

  .btn-topo{position:fixed;right:calc(14px + var(--safe-r));bottom:calc(18px + var(--safe-b));width:46px;height:46px;border-radius:50%;background:var(--charcoal);color:#fff;border:none;box-shadow:0 3px 10px rgba(0,0,0,0.3);font-size:19px;display:none;align-items:center;justify-content:center;z-index:30;cursor:pointer;}
  .btn-topo.show{display:flex;}

  .loading, .empty{text-align:center;padding:26px 12px;opacity:0.6;font-size:13px;}

  h2.block-title{font-size:14px;font-weight:700;color:var(--charcoal);margin:20px 2px 8px;text-transform:uppercase;letter-spacing:0.3px;}
  h2.block-title:first-of-type{margin-top:0;}

  /* ---------- seções de encarregado (equipe própria) ---------- */
  .team-section{background:#fff;border:1px solid #ddd;border-radius:12px;margin-bottom:12px;overflow:hidden;}
  .team-section summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px;background:#f7f7f8;border-left:6px solid var(--charcoal);min-height:44px;}
  .team-section summary::-webkit-details-marker{display:none;}
  .team-section .dot{width:11px;height:11px;border-radius:50%;background:var(--charcoal);flex-shrink:0;}
  .team-section .tname{font-weight:700;font-size:14.5px;flex:1;}
  .team-section .tcount{font-size:12px;padding:3px 11px;background:var(--concrete);border-radius:20px;font-weight:600;}

  /* 2 cards lado a lado já no celular (cabe mais gente na tela, rola menos) —
     auto-fit com esse mínimo cai pra 1 coluna sozinho em telas bem estreitas. */
  .team-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(148px, 1fr));gap:8px;padding:10px;}

  /* ---------- card de funcionário (mobile: foto+info em cima, seletor embaixo) ---------- */
  /* card compacto, pra encarregado rolar menos a tela pra ver todo mundo */
  .team-card{display:flex;flex-direction:column;gap:6px;border:1px solid #e2e2e6;border-radius:11px;padding:8px;background:#fff;min-width:0;}
  /* cartão de empresa terceirizada: recuado (indentado) e com visual mais
     discreto que o card de pessoa, pra ficar claro que representa um time
     inteiro, não alguém específico */
  .tc-empresa-card{margin-left:18px;background:var(--concrete);border-color:#d8d7db;border-style:dashed;}
  .tc-empresa-card .tc-nome{opacity:0.85;}
  .tc-top{display:flex;align-items:center;gap:8px;}
  .tc-photo{position:relative;width:40px;height:40px;flex-shrink:0;border-radius:10px;overflow:hidden;cursor:pointer;background:var(--brand-graylight);}
  .tc-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .tc-avatar{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;}
  .tc-photo-badge{position:absolute;bottom:-3px;right:-3px;width:18px;height:18px;border-radius:50%;background:var(--charcoal);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:9px;line-height:1;}
  .tc-photo.uploading{opacity:0.5;}
  .tc-presenca-dot{position:absolute;top:-3px;right:-3px;width:13px;height:13px;border-radius:50%;border:2px solid #fff;z-index:2;}
  .tc-presenca-dot.presente{background:#2F9E44;}
  .tc-presenca-dot.falta{background:#B00020;}
  .tc-zoom{position:absolute;top:-3px;left:-3px;width:18px;height:18px;border-radius:50%;background:rgba(28,28,30,0.75);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:9px;line-height:1;color:#fff;cursor:pointer;}

  .tc-info{flex:1;min-width:0;}
  /* só o card de pessoa abre perfil ao tocar (o de empresa não tem perfil individual) */
  .team-card:not(.tc-empresa-card) .tc-info{cursor:pointer;}
  /* nome trunca em 2 linhas (com "...") em vez de esticar o card quando é
     comprido — importante agora que 2 cards cabem lado a lado no celular e
     sobra pouca largura pro texto */
  .tc-nome{font-weight:600;font-size:12.5px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;}
  .tc-funcao{font-size:10.5px;opacity:0.65;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tc-empresa{font-size:9px;opacity:0.5;margin-top:1px;text-transform:uppercase;letter-spacing:0.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tc-estrelas{font-size:10px;color:#D9A404;margin-top:2px;letter-spacing:1px;white-space:nowrap;overflow:hidden;}

  .tc-select select{width:100%;font-size:15px;padding:7px 8px;border:1px solid #ddd;border-radius:8px;background:#fafafa;min-height:36px;}

  /* ---------- arrastar card pra outro encarregado ---------- */
  .tc-handle{flex-shrink:0;margin-left:auto;padding:6px 4px;color:var(--brand-graymid);font-size:16px;line-height:1;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;}
  .team-card.drag-source-hidden{display:none;}
  .drag-ghost{position:fixed;z-index:999;pointer-events:none;opacity:0.96;box-shadow:0 12px 30px rgba(0,0,0,0.3);transform:scale(1.03);background:#fff;}
  .team-section.drag-over{outline:2px dashed var(--charcoal);outline-offset:-2px;}
  .team-section.drag-over summary{background:#dbe7ff;}
  .tc-placeholder{border:2px dashed #9fb3d9;border-radius:12px;background:rgba(6,53,147,0.06);box-sizing:border-box;}

  .toast{position:fixed;bottom:calc(20px + var(--safe-b));left:50%;transform:translateX(-50%);background:var(--brand-black);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;z-index:200;transition:opacity 0.3s;max-width:90%;text-align:center;}
  .toast.show{opacity:1;}

  .err-banner{position:fixed;top:0;left:0;right:0;background:#B00020;color:#fff;padding:10px 14px;font-size:12px;font-family:monospace;z-index:9999;display:none;word-break:break-word;}
  .err-banner.show{display:block;}

  /* ---------- foto ampliada (toque na lupa do card) ---------- */
  .photo-lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:300;padding:calc(20px + var(--safe-t)) calc(20px + var(--safe-r)) calc(20px + var(--safe-b)) calc(20px + var(--safe-l));}
  .photo-lightbox.show{display:flex;}
  .photo-lightbox img{max-width:100%;max-height:100%;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,0.5);}
  .photo-lightbox .lb-close{position:absolute;top:calc(14px + var(--safe-t));right:calc(14px + var(--safe-r));width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.15);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;}
  .photo-lightbox .lb-nome{position:absolute;bottom:calc(14px + var(--safe-b));left:0;right:0;text-align:center;color:#fff;font-size:14px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,0.6);}

  /* ---------- perfil da pessoa (toque no nome/info do card) ---------- */
  .perfil-modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:flex-end;justify-content:center;z-index:250;}
  .perfil-modal.show{display:flex;}
  .perfil-sheet{background:#fff;width:100%;max-width:440px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + var(--safe-b));max-height:88vh;overflow-y:auto;position:relative;}
  .perfil-close{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:var(--concrete);color:var(--brand-black);border:none;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .perfil-topo{display:flex;align-items:center;gap:14px;padding-right:38px;}
  .perfil-foto{position:relative;width:66px;height:66px;flex-shrink:0;border-radius:14px;overflow:hidden;background:var(--brand-graylight);}
  .perfil-foto img{width:100%;height:100%;object-fit:cover;display:block;}
  .perfil-foto .tc-avatar{font-size:22px;}
  .perfil-nome{font-weight:700;font-size:17px;line-height:1.25;}
  .perfil-sub{font-size:12.5px;opacity:0.65;margin-top:2px;}
  .perfil-estrelas{margin-top:16px;}
  .perfil-estrelas .rotulo{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;opacity:0.55;margin-bottom:4px;}
  .perfil-estrelas .valor{font-size:20px;color:#D9A404;letter-spacing:2px;}
  .perfil-estrelas .semnota{font-size:13px;opacity:0.55;font-style:italic;}
  .perfil-obs{margin-top:18px;}
  .perfil-obs .rotulo{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;opacity:0.55;margin-bottom:6px;}
  .perfil-obs textarea{width:100%;min-height:96px;font-family:inherit;font-size:14.5px;padding:10px 12px;border:1px solid #ddd;border-radius:10px;background:#fafafa;resize:vertical;line-height:1.4;}
  .perfil-obs-acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;}
  .perfil-obs-acoes button{border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;min-height:38px;}
  .perfil-obs-salvar{background:var(--charcoal);color:#fff;}
  .perfil-obs-salvar:disabled{opacity:0.5;cursor:default;}
  .perfil-obs-status{font-size:11.5px;opacity:0.55;margin-top:6px;text-align:right;min-height:14px;}

  @media (min-width:700px){
    .perfil-modal{align-items:center;}
    .perfil-sheet{border-radius:16px;max-width:420px;}
  }

  /* ---------- tablet (iPad em diante) ---------- */
  @media (min-width:700px){
    body{font-size:16px;}
    .head{padding:14px 22px;}
    .head img{height:38px;}
    .head h1{font-size:19px;}
    .head .sub{font-size:12px;}
    .head button{font-size:13px;padding:9px 15px;}
    .filters{padding:14px 22px;display:flex;align-items:center;gap:12px;}
    .filters input{flex:1;}
    .filters .hint{margin-top:0;flex-shrink:0;max-width:260px;}
    .content{padding:20px;}
    .cards{grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:10px;}
    .team-grid{grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));}
    .team-card{flex-direction:row;align-items:center;}
    .tc-top{flex:1;min-width:0;}
    .tc-select{flex-shrink:0;width:auto;}
    .tc-select select{width:auto;max-width:118px;font-size:13px;padding:8px 6px;min-height:38px;}
  }

  /* ---------- desktop ---------- */
  @media (min-width:1000px){
    .content{padding:24px;}
  }
</style>
</head>
<body>
<div class="err-banner" id="errBanner"></div>
<script>
window.addEventListener('error', function(e) {
  var b = document.getElementById('errBanner');
  if (b) { b.textContent = '⚠️ ERRO: ' + e.message + ' (linha ' + e.lineno + ')'; b.classList.add('show'); }
});
window.addEventListener('unhandledrejection', function(e) {
  var b = document.getElementById('errBanner');
  if (b) { b.textContent = '⚠️ ERRO (promise): ' + (e.reason && e.reason.message ? e.reason.message : e.reason); b.classList.add('show'); }
});
</script>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>🧑‍🤝‍🧑 Gestão de Equipes</h1>
    <div class="error" id="loginError"></div>
    <input type="text" id="loginUser" placeholder="Usuário" autocomplete="username">
    <input type="password" id="loginPassword" placeholder="Senha" autocomplete="current-password">
    <button id="loginBtn" onclick="doLogin()">Entrar</button>
  </div>
</div>

        <button class="perfil-obs-salvar" id="perfilCatracaBtn" onclick="cadastrarNaCatraca()">📷 Cadastrar na catraca</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// CONFIG SUPABASE
// ============================================================
const OBRA_ID = 'diamond_millennium';
const SUPABASE_URL = 'https://otlzehasidzannsczcnv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_EsUxMlHlz4XiUjso5Yit-g_vtl7_Ius';
const BUCKET = 'fotos-equipe';

// Equipe própria da Diamond: aqui SIM cada funcionário é atribuído pessoa a
// pessoa (campo funcionarios.encarregado = o id abaixo). Pra adicionar/remover
// um encarregado, editar este array — não mudar o id de quem já tem gente
// atribuída, senão essas pessoas "somem" pra Sem encarregado.
const EQUIPE_PROPRIA = [
  { id: 'BEIJAMIN', label: 'Beijamin', color: '#0053D8' },
  { id: 'WESCLEY',  label: 'Wescley',  color: '#2F9E44' },
  { id: 'EVANDRO',  label: 'Evandro',  color: '#E8590C' },
];

// Equipes terceirizadas: aqui NÃO se atribui pessoa a pessoa — cada empresa
// terceirizada vira um cartão único representando o time inteiro, sem listar
// cada funcionário. Quem é terceirizado é descoberto automaticamente: basta
// a empresa não começar com "DIAMOND" (qualquer empreiteira: RMC, N&A
// Elétrica, Asas da Hidráulica, AGS Armação, MEI e variantes, etc. — não
// precisa cadastrar cada uma no código, novas empreiteiras já entram
// sozinhas). Essas pessoas somem da lista "Sem encarregado" da equipe
// própria, já que estão contabilizadas no cartão único da empresa delas.
function isEquipePropriaEmpresa(f) {
  return (f.empresa || '').toUpperCase().trim().startsWith('DIAMOND');
}

// "MEI" (Microempreendedor Individual) não é uma empreiteira com um time e
// um encarregado — cada um é um profissional independente por conta própria,
// mesmo que vários compartilhem o mesmo texto de empresa (ex.: "MEI",
// "MEI - FORRO DE GESSO"). Por isso não entram no cartão único da empresa:
// aparecem cada um com seu próprio card, igual à equipe própria.
function isMEIIndependente(f) {
  return (f.empresa || '').toUpperCase().trim().startsWith('MEI');
}

// true se este funcionário é de empresa terceirizada (portanto não deve
// aparecer individualmente na equipe própria / Sem encarregado — só no
// cartão único da empresa dele)
function isTerceirizado(f) {
  return !isEquipePropriaEmpresa(f) && !isMEIIndependente(f);
}

// Paleta fixa de cores pros cartões de empresa terceirizada — a cor de cada
// empresa é escolhida por hash do nome, então continua estável mesmo que
// outras empresas apareçam/desapareçam da lista.
const PALETA_EMPRESAS_TERCEIRIZADAS = ['#8E44AD', '#16A085', '#B7950B', '#34495E', '#C2185B', '#1F618D', '#C0392B', '#2C3E50', '#7D6608', '#117864', '#943126', '#5B2C6F', '#6D4C41', '#AA6C39'];
function corPorEmpresa(nome) {
  let hash = 0;
  for (let i = 0; i < nome.length; i++) hash = (hash * 31 + nome.charCodeAt(i)) >>> 0;
  return PALETA_EMPRESAS_TERCEIRIZADAS[hash % PALETA_EMPRESAS_TERCEIRIZADAS.length];
}

// Agrupa quem é terceirizado por empresa (ignorando quem já foi excluído da
// gestão, ex.: escritório) e monta 1 "pseudo-card" por empresa: nome fixo
// "Encarregado <empresa>" (sem nome de pessoa, só o rótulo genérico) e a
// contagem de quantas pessoas essa empresa tem hoje.
// Também descobre se todo mundo da empresa já está sob o MESMO encarregado
// (BEIJAMIN/WESCLEY/EVANDRO) — se sim, o cartão da empresa mora dentro da
// seção desse encarregado; se está misto (ou ninguém foi arrastado ainda),
// o cartão fica em "Sem encarregado" até alguém arrastar ele pra um dos 3.
function computeGruposTerceirizados() {
  const map = new Map();
  funcionarios.forEach(f => {
    if (!isTerceirizado(f) || isExcluidoGestao(f)) return;
    const label = (f.empresa || 'SEM EMPRESA').trim();
    const key = label.toUpperCase();
    if (!map.has(key)) map.set(key, { label, count: 0, encarregados: new Set() });
    const grupo = map.get(key);
    grupo.count++;
    grupo.encarregados.add(f.encarregado || null);
  });
  return Array.from(map.values())
    .map(g => ({
      label: g.label,
      count: g.count,
      pessoa: 'Encarregado ' + g.label,
      color: corPorEmpresa(g.label),
      encarregado: g.encarregados.size === 1 ? Array.from(g.encarregados)[0] : null,
    }))
    .sort((a, b) => a.label.localeCompare(b.label, 'pt-BR'));
}

// Pessoal de escritório/administrativo (engenheiro, RH, almoxarife, vigia etc.)
// não faz parte de nenhuma equipe de campo — não entra nessa tela de gestão
// de equipe (nem em "Sem encarregado", nem em nenhum time).
function isExcluidoGestao(f) {
  return (f.alocacao || '').toUpperCase().trim() === 'ESCRITÓRIO';
}

// filtro único usado em todo lugar que monta a lista de "equipe própria"
function ehEquipePropria(f) {
  return !isTerceirizado(f) && !isExcluidoGestao(f);
}

let sb = null;
try {
  if (window.supabase) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });
  }
} catch (e) {
  console.error('Falha ao iniciar Supabase:', e);
}

// ============================================================
// LOG DE EDIÇÕES (painel administrativo, 2026-09-23) — registra quem fez
// cada edição importante, pro admin.html mostrar depois. Nunca trava a ação
// principal se o registro falhar (ex.: tabela ainda não criada). O nome de
// quem editou vem da sessão individual que o app.html grava no login único
// (mesma chave "usuario_atual" usada pelo Diário de Obra) — se a pessoa
// abriu esta tela solta, fora do app, não tem como saber quem é, e o log
// fica com "Desconhecido".
// ============================================================
async function registrarEdicao(acao, descricao) {
  try {
    if (!sb) return;
    let nomeUsuario = 'Desconhecido';
    try {
      const raw = localStorage.getItem(`${OBRA_ID}:usuario_atual`);
      if (raw) { const u = JSON.parse(raw); if (u && u.nome) nomeUsuario = u.nome; }
    } catch (e2) {}
    await sb.from('log_edicoes').insert({ pagina: 'equipes', acao, descricao, usuario_nome: nomeUsuario });
  } catch (e) { /* log é só um extra, nunca deve travar a ação real */ }
}

// ============================================================
// STORAGE SEGURO (só usado pra lembrar o login neste navegador)
// ============================================================
const memStore = {};
function safeGet(key) {
  const k = `${OBRA_ID}:${key}`;
  try { return localStorage.getItem(k); } catch (e) { return memStore[k] ?? null; }
}
function safeSet(key, value) {
  const k = `${OBRA_ID}:${key}`;
  try { localStorage.setItem(k, value); } catch (e) { memStore[k] = value; }
}
function safeRemove(key) {
  const k = `${OBRA_ID}:${key}`;
  try { localStorage.removeItem(k); } catch (e) { delete memStore[k]; }
}

// ============================================================
// LOGIN FIXO (mesmo login do app de presença/dashboard)
// ============================================================
const LOGIN_USER = 'junior';
const LOGIN_PASS = '123654';

function doLogin() {
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';

  if (user === LOGIN_USER && pass === LOGIN_PASS) {
    safeSet('logged_in', 'true');
    showApp();
  } else {
    errEl.textContent = '❌ Usuário ou senha inválidos';
  }
}

function doLogout() {
  safeRemove('logged_in');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('app').style.display = 'none';
}

function checkExistingSession() {
  if (safeGet('logged_in') === 'true') showApp();
}

async function showApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').style.display = 'block';
  await loadData();
}

// ============================================================
// DADOS
// ============================================================
let funcionarios = [];

// funcionario_id (string) -> 'presente' | 'falta', só de HOJE. Usado pra
// pintar a bolinha de presença no card. Fica vazio se a consulta falhar —
// nesse caso os cards simplesmente não mostram bolinha nenhuma.
let presencaHojeMap = new Map();

// data de hoje no formato do banco (AAAA-MM-DD), usando componentes locais
// do navegador — nunca toISOString() puro (já causou bug de fuso horário
// em outros arquivos deste sistema).
function hojeStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

async function loadData() {
  const wrap = document.getElementById('sectionsWrap');
  if (!sb) { wrap.innerHTML = '<div class="empty">Sem conexão com o Supabase.</div>'; return; }
  wrap.innerHTML = '<div class="loading">Carregando...</div>';
  try {
    const { data, error } = await sb
      .from('funcionarios')
      .select('id, empresa, nome, funcao, alocacao, tipo, ativo, encarregado, foto_path, ordem, updated_at, classificacao, observacao, matricula_catraca, catraca_cadastro_pendente')
      .eq('tipo', 'permanente')
      .eq('ativo', true)
      .order('nome', { ascending: true });
    if (error) throw error;
    funcionarios = data || [];
    render();
  } catch (e) {
    wrap.innerHTML = '<div class="empty">Erro ao carregar funcionários. Verifique se as colunas "encarregado", "foto_path" e "ordem" já existem na tabela (rode o equipes_setup_diamond.sql).</div>';
    console.error(e);
    return;
  }

  // presença de hoje — busca DEPOIS de já mostrar os cards, e nunca trava a
  // tela principal: se demorar ou falhar, os cards continuam visíveis, só
  // sem bolinha até essa segunda busca terminar (ou pra sempre, se falhar).
  try {
    const { data: presData, error: presError } = await sb
      .from('presenca')
      .select('funcionario_id, status')
      .eq('data', hojeStr());
    if (presError) throw presError;
    presencaHojeMap = new Map((presData || []).map(p => [String(p.funcionario_id), p.status]));
    render();
  } catch (presE) {
    presencaHojeMap = new Map();
    console.error('Não deu pra carregar a presença de hoje:', presE);
  }
}

// ============================================================
// RENDER
// ============================================================
function render() {
  renderSummary();
  renderSections();
}

function renderSummary() {
  const el = document.getElementById('summaryCards');
  const proprios = funcionarios.filter(ehEquipePropria);
  const semEncarregado = proprios.filter(f => !f.encarregado).length;
  // "Equipe própria" é só informativo (soma tudo, não é 1 seção só) — os
  // outros tiles pulam direto pra seção correspondente (classe "jump"),
  // pra não precisar rolar a lista toda pra chegar lá.
  let html = `<div class="card"><div class="n">${proprios.length}</div><div class="l">Equipe própria</div></div>`;
  EQUIPE_PROPRIA.forEach(enc => {
    const n = proprios.filter(f => f.encarregado === enc.id).length;
    html += `<div class="card jump" style="border-top-color:${enc.color};" onclick="irParaSecao('${enc.id}')"><div class="n">${n}</div><div class="l">${enc.label}</div></div>`;
  });
  html += `<div class="card warn jump" onclick="irParaSecao('SEM')"><div class="n">${semEncarregado}</div><div class="l">Sem encarregado</div></div>`;
  el.innerHTML = html;
}

// Pula direto pra seção (abre se estiver fechada) sem precisar rolar a lista
// toda — chamado ao tocar num dos tiles de resumo lá em cima.
function irParaSecao(key) {
  sectionExpandedState[key] = true;
  render();
  requestAnimationFrame(() => {
    const el = document.getElementById('sec_' + key);
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    el.classList.add('just-jumped');
    setTimeout(() => el.classList.remove('just-jumped'), 1100);
  });
}

// Mostra o botão "voltar ao topo" só depois de rolar um pouco a página —
// evita poluir a tela quando já dá pra ver a busca e os tiles de resumo.
window.addEventListener('scroll', () => {
  const btn = document.getElementById('btnTopo');
  if (!btn) return;
  btn.classList.toggle('show', window.scrollY > 320);
});

function matchesSearch(f, q) {
  if (!q) return true;
  return f.nome.toLowerCase().includes(q) ||
    (f.funcao || '').toLowerCase().includes(q) ||
    (f.empresa || '').toLowerCase().includes(q) ||
    (f.alocacao || '').toLowerCase().includes(q);
}

// Ordena pela posição manual (campo "ordem") quando existir; quem ainda não
// foi reposicionado à mão (ordem null) fica no fim, em ordem alfabética.
// Assim que alguém arrasta um card dentro de um grupo, o grupo inteiro passa
// a ter "ordem" definida e essa posição fica salva pra sempre.
function compareMembros(a, b) {
  const ao = (a.ordem === null || a.ordem === undefined) ? null : Number(a.ordem);
  const bo = (b.ordem === null || b.ordem === undefined) ? null : Number(b.ordem);
  if (ao !== null && bo !== null && ao !== bo) return ao - bo;
  if (ao !== null && bo === null) return -1;
  if (ao === null && bo !== null) return 1;
  return a.nome.localeCompare(b.nome, 'pt-BR');
}

// Seções da equipe própria (Beijamin/Wescley/Evandro + Sem encarregado).
// Quem já está coberto por um cartão de time terceirizado (isTerceirizado)
// não aparece aqui — ele é representado só pelo cartão do time, não pessoa a
// pessoa.
// Lembra se cada seção está aberta/fechada entre uma renderização e outra
// (chave: id do grupo, ou 'SEM' pra "Sem encarregado"). Sem isso, toda vez
// que a tela atualiza — ao trocar de foto, reatribuir alguém ou clicar em
// Atualizar — o innerHTML é reconstruído do zero e as seções que o usuário
// tinha fechado voltavam a abrir sozinhas.
let sectionExpandedState = {};

function renderSections() {
  const wrap = document.getElementById('sectionsWrap');
  const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
  const proprios = funcionarios.filter(ehEquipePropria);

  // Só existem 4 seções agora: Sem encarregado + os 3 encarregados de
  // verdade (Beijamin/Wescley/Evandro). As empresas terceirizadas não têm
  // mais seção própria — o cartão de cada empresa mora dentro de uma dessas
  // 4, e o usuário decide qual arrastando o card (ver applyReorderEmpresa).
  const gruposTerceirizados = computeGruposTerceirizados()
    .filter(g => !q || g.label.toLowerCase().includes(q) || g.pessoa.toLowerCase().includes(q));

  const groups = [
    { id: null, label: 'Sem encarregado', color: '#B00020', unassigned: true },
    ...EQUIPE_PROPRIA.map(e => ({ ...e, unassigned: false })),
  ];

  let html = '';

  if (!proprios.length && !gruposTerceirizados.length) {
    html += '<div class="empty">Nenhum funcionário encontrado.</div>';
  }

  groups.forEach(g => {
    const membros = proprios
      .filter(f => (g.id === null ? !f.encarregado : f.encarregado === g.id))
      .filter(f => matchesSearch(f, q))
      .sort(compareMembros);

    const empresasDoGrupo = gruposTerceirizados
      .filter(t => (g.id === null ? !t.encarregado : t.encarregado === g.id));

    if (q && !membros.length && !empresasDoGrupo.length) return; // durante busca, esconde seção vazia

    const key = g.id || 'SEM';
    // durante busca força aberto (pra ver o resultado); fora da busca respeita
    // o que o usuário escolheu antes. Padrão na primeira vez: tudo começa
    // fechado (só os 3 encarregados + Sem encarregado existem, e toque abre).
    const isOpen = q ? true : (key in sectionExpandedState ? sectionExpandedState[key] : false);
    const totalCards = membros.length + empresasDoGrupo.length;

    html += `<details class="team-section ${g.unassigned ? 'unassigned' : ''}" id="sec_${key}" data-group="${key}" ${isOpen ? 'open' : ''}>
      <summary style="border-left-color:${g.color};">
        <span class="dot" style="background:${g.color};"></span>
        <span class="tname">${g.label}</span>
        <span class="tcount">${totalCards}</span>
      </summary>
      <div class="team-grid">
        ${totalCards
          ? (empresasDoGrupo.map(t => terceirizadaCardHtml(t)).join('') + membros.map(f => cardHtml(f)).join(''))
          : '<div class="empty">Ninguém aqui.</div>'}
      </div>
    </details>`;
  });

  wrap.innerHTML = html;
}

// O evento "toggle" de <details> não borbulha (bubbles:false), mas ainda
// passa pela fase de captura — por isso o listener é registrado com
// capture:true num elemento fixo (não recriado a cada render), pra
// continuar funcionando mesmo depois do innerHTML ser trocado.
document.getElementById('sectionsWrap').addEventListener('toggle', (e) => {
  const det = e.target;
  if (det && det.tagName === 'DETAILS' && det.dataset.group) {
    sectionExpandedState[det.dataset.group] = det.open;
  }
}, true);

// ============================================================
// ARRASTAR CARD PRA MUDAR DE ENCARREGADO
// Segura na alcinha (⠿) do card e arrasta pra cima do cabeçalho de outra
// seção (aberta ou fechada) pra reatribuir. Usa Pointer Events, que funciona
// igual com dedo (celular/iPad) e mouse (desktop). Ao soltar, chama a mesma
// reassign() que o seletor já usa — mesma validação, mesmo toast.
// ============================================================
let dragState = null;

document.getElementById('sectionsWrap').addEventListener('pointerdown', (e) => {
  const handle = e.target.closest('.tc-handle');
  if (!handle) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return; // só botão esquerdo do mouse
  const card = handle.closest('.team-card');
  if (!card) return;
  startDrag(e, handle, card);
});

function startDrag(e, handle, cardEl) {
  e.preventDefault();
  const rect = cardEl.getBoundingClientRect();

  const ghost = cardEl.cloneNode(true);
  ghost.classList.add('drag-ghost');
  ghost.style.width = rect.width + 'px';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  document.body.appendChild(ghost);

  // espaço vazio (tracejado) que mostra onde o card vai cair — do tamanho do
  // card original, pra não "pular" o layout quando ele entra em cena
  const placeholder = document.createElement('div');
  placeholder.className = 'tc-placeholder';
  placeholder.style.height = rect.height + 'px';

  cardEl.classList.add('drag-source-hidden');
  // aparece já no lugar do card original, pra sempre existir um espaço visível
  cardEl.parentNode.insertBefore(placeholder, cardEl);

  // dois tipos de card podem ser arrastados: um funcionário (data-fid) ou
  // um cartão de empresa terceirizada inteira (data-empresa)
  const isEmpresa = cardEl.dataset.empresa !== undefined;

  dragState = {
    kind: isEmpresa ? 'empresa' : 'funcionario',
    fid: cardEl.dataset.fid,
    empresa: cardEl.dataset.empresa,
    cardEl,
    ghost,
    placeholder,
    offsetX: e.clientX - rect.left,
    offsetY: e.clientY - rect.top,
    targetKey: null,
  };

  try { handle.setPointerCapture(e.pointerId); } catch (err) {}
  handle.addEventListener('pointermove', onDragMove);
  handle.addEventListener('pointerup', onDragEnd);
  handle.addEventListener('pointercancel', onDragEnd);
}

function onDragMove(e) {
  if (!dragState) return;
  e.preventDefault();
  const { ghost, offsetX, offsetY, placeholder, cardEl } = dragState;
  ghost.style.left = (e.clientX - offsetX) + 'px';
  ghost.style.top = (e.clientY - offsetY) + 'px';

  // rola a página sozinho se arrastar perto da borda de cima/baixo da tela
  const margin = 70;
  if (e.clientY < margin) window.scrollBy(0, -14);
  else if (e.clientY > window.innerHeight - margin) window.scrollBy(0, 14);

  const under = document.elementFromPoint(e.clientX, e.clientY);
  const section = under ? under.closest('.team-section') : null;
  document.querySelectorAll('.team-section.drag-over').forEach(s => {
    if (s !== section) s.classList.remove('drag-over');
  });

  if (section) {
    section.classList.add('drag-over');
    dragState.targetKey = section.dataset.group;
    const grid = section.querySelector('.team-grid');
    positionPlaceholder(grid, placeholder, cardEl, e.clientX, e.clientY);
  } else {
    dragState.targetKey = null;
  }
}

// Decide, dentro da lista de cards embaixo do ponteiro, entre quais dois
// cards o espaço tracejado deve ficar (compara com o meio de cada card).
function positionPlaceholder(grid, placeholder, cardEl, pointerX, pointerY) {
  if (!grid) return;
  // no mobile o grid é 1 coluna só, mas no tablet/desktop vira grade com
  // vários cards lado a lado na mesma linha — por isso não dá pra decidir
  // a posição olhando só a altura (Y): também tem que olhar a coluna (X),
  // senão nunca dá pra soltar "no meio" de uma linha com 2+ cards.
  const cards = Array.from(grid.querySelectorAll('.team-card')).filter(c => c !== cardEl && c !== placeholder);
  let refCard = null;
  for (const c of cards) {
    const r = c.getBoundingClientRect();
    const mesmaLinha = pointerY >= r.top && pointerY <= r.bottom;
    if (mesmaLinha) {
      const centroX = r.left + r.width / 2;
      if (pointerX < centroX) { refCard = c; break; }
      // senão continua pros próximos cards da mesma linha (ou passa pra próxima)
    } else if (pointerY < r.top) {
      refCard = c;
      break;
    }
  }
  if (refCard) {
    if (placeholder.nextSibling !== refCard) grid.insertBefore(placeholder, refCard);
  } else if (grid.lastElementChild !== placeholder) {
    grid.appendChild(placeholder);
  }
}

function onDragEnd(e) {
  if (!dragState) return;
  const { kind, fid, empresa, ghost, cardEl, placeholder, targetKey } = dragState;

  // a posição do placeholder no grid final é a posição de inserção
  let insertIndex = null;
  if (placeholder.parentNode) {
    insertIndex = Array.from(placeholder.parentNode.children).indexOf(placeholder);
  }

  document.querySelectorAll('.team-section.drag-over').forEach(s => s.classList.remove('drag-over'));
  ghost.remove();
  if (placeholder.parentNode) placeholder.remove();
  cardEl.classList.remove('drag-source-hidden');

  const handle = e.target;
  handle.removeEventListener('pointermove', onDragMove);
  handle.removeEventListener('pointerup', onDragEnd);
  handle.removeEventListener('pointercancel', onDragEnd);
  try { handle.releasePointerCapture(e.pointerId); } catch (err) {}

  dragState = null;

  if (targetKey && kind === 'funcionario' && insertIndex !== null) {
    applyReorder(fid, targetKey, insertIndex);
  } else if (targetKey && kind === 'empresa') {
    // cartão de empresa: não tem "ordem" própria (representa várias pessoas
    // de uma vez), então arrastar só decide o encarregado responsável
    applyReorderEmpresa(empresa, targetKey);
  }
}

// Aplica a nova posição (e, se mudou de seção, o novo encarregado). Recalcula
// a ordem de todo mundo do grupo de destino e salva de uma vez — os grupos
// são pequenos (times de um encarregado), então isso é barato e evita contas
// de "encaixar um número entre dois outros" que complicam com o tempo.
async function applyReorder(fid, targetKey, insertIndex) {
  const item = funcionarios.find(f => String(f.id) === String(fid));
  if (!item) return;

  const novoEncarregado = targetKey === 'SEM' ? null : targetKey;

  const membrosDestino = funcionarios
    .filter(f => ehEquipePropria(f) && String(f.id) !== String(fid))
    .filter(f => (novoEncarregado === null ? !f.encarregado : f.encarregado === novoEncarregado))
    .sort(compareMembros);

  const idx = Math.max(0, Math.min(insertIndex, membrosDestino.length));
  membrosDestino.splice(idx, 0, item);

  const updates = membrosDestino.map((f, i) => ({ id: f.id, ordem: i * 10 }));

  // guarda o estado anterior de todo mundo que vai mudar, pra poder desfazer
  // se o banco recusar a gravação
  const encarregadoAnterior = item.encarregado;
  const ordensAnteriores = new Map(updates.map(u => {
    const f = funcionarios.find(x => String(x.id) === String(u.id));
    return [u.id, f ? f.ordem : null];
  }));

  // atualização otimista: já reflete na tela antes de confirmar no banco
  updates.forEach(u => {
    const f = funcionarios.find(x => String(x.id) === String(u.id));
    if (f) f.ordem = u.ordem;
  });
  const encarregadoMudou = encarregadoAnterior !== novoEncarregado;
  item.encarregado = novoEncarregado;
  render();

  if (!sb) { showToast('⚠️ Sem conexão — a posição não foi salva.'); return; }
  try {
    // update individual por linha (não upsert): só mexe nas colunas informadas,
    // sem esbarrar em constraints NOT NULL de colunas que não fazem parte do payload
    const results = await Promise.all(updates.map(u => {
      const patch = { ordem: u.ordem };
      if (u.id === item.id) patch.encarregado = novoEncarregado;
      return sb.from('funcionarios').update(patch).eq('id', u.id);
    }));
    const falhou = results.find(r => r.error);
    if (falhou) throw falhou.error;
    showToast('✅ Posição atualizada!');
    // só loga quando arrastar de verdade mudou de equipe — reordenar dentro
    // da mesma seção é rotina demais pra valer a pena registrar
    if (encarregadoMudou) {
      const nomeDestino = novoEncarregado ? (EQUIPE_PROPRIA.find(x => x.id === novoEncarregado) || {}).label : 'Sem encarregado';
      registrarEdicao('editar', `Moveu ${item.nome} (arrastar) para "${nomeDestino || novoEncarregado}"`);
    }
  } catch (e) {
    // desfaz a atualização otimista de todo mundo se o banco recusou
    updates.forEach(u => {
      const f = funcionarios.find(x => String(x.id) === String(u.id));
      if (f) f.ordem = ordensAnteriores.get(u.id);
    });
    item.encarregado = encarregadoAnterior;
    render();
    showToast('⚠️ Erro ao salvar a posição: ' + (e.message || e));
  }
}

// Arrastar o cartão de uma empresa terceirizada pra dentro de Beijamin/
// Wescley/Evandro (ou de volta pra "Sem encarregado"). Como o cartão
// representa a empresa inteira, não uma pessoa, isso atualiza de uma vez o
// campo "encarregado" de TODOS os funcionários ativos dessa empresa — não
// tem "ordem" individual pra decidir aqui.
//
// Mesma coisa que arrastar o card, só que pelo seletor do card da empresa
// (igual o seletor que já existe nos cards de pessoa).
function reassignEmpresa(empresaLabel, encarregado) {
  applyReorderEmpresa(empresaLabel, encarregado || 'SEM');
}

async function applyReorderEmpresa(empresaLabel, targetKey) {
  const novoEncarregado = targetKey === 'SEM' ? null : targetKey;
  const key = (empresaLabel || '').toUpperCase();
  const afetados = funcionarios.filter(f =>
    isTerceirizado(f) && !isExcluidoGestao(f) && (f.empresa || '').trim().toUpperCase() === key
  );
  if (!afetados.length) return;

  const empresaReal = afetados[0].empresa; // valor exato salvo no banco, pro filtro do update
  const anteriores = afetados.map(f => f.encarregado);

  // atualização otimista
  afetados.forEach(f => { f.encarregado = novoEncarregado; });
  render();

  if (!sb) { showToast('⚠️ Sem conexão — não foi salvo.'); return; }
  try {
    const { error } = await sb
      .from('funcionarios')
      .update({ encarregado: novoEncarregado })
      .eq('empresa', empresaReal)
      .eq('tipo', 'permanente')
      .eq('ativo', true);
    if (error) throw error;
    const nomeDestino = novoEncarregado ? (EQUIPE_PROPRIA.find(x => x.id === novoEncarregado) || {}).label : 'Sem encarregado';
    showToast(`✅ ${empresaLabel} agora em "${nomeDestino || novoEncarregado}"`);
    registrarEdicao('editar', `Moveu a empresa "${empresaLabel}" (${afetados.length} pessoa(s)) para "${nomeDestino || novoEncarregado}"`);
  } catch (e) {
    // desfaz se o banco recusou
    afetados.forEach((f, i) => { f.encarregado = anteriores[i]; });
    render();
    showToast('⚠️ Erro ao mover a empresa: ' + (e.message || e));
  }
}

// Cartão único por empresa terceirizada — mesmo componente visual do
// team-card (pra ficar igual ao resto dos cards), mas sem os controles que
// não fazem sentido pra um cartão que representa a empresa inteira: sem
// foto/upload, sem lupa, sem seletor de encarregado, sem arrastar.
function terceirizadaCardHtml(g) {
  const empresaAttr = g.label.replace(/"/g, '&quot;');
  const empresaJs = g.label.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

  const options = [`<option value="" ${!g.encarregado ? 'selected' : ''}>Nenhum</option>`]
    .concat(EQUIPE_PROPRIA.map(e => `<option value="${e.id}" ${g.encarregado === e.id ? 'selected' : ''}>${e.label}</option>`))
    .join('');

  return `
    <div class="team-card tc-empresa-card" data-empresa="${empresaAttr}">
      <div class="tc-top">
        <div class="tc-photo">
          <div class="tc-avatar" style="background:${g.color};">${initials(g.pessoa)}</div>
        </div>
        <div class="tc-info">
          <div class="tc-nome">${g.pessoa}</div>
          <div class="tc-funcao">${g.count} ${g.count === 1 ? 'pessoa' : 'pessoas'} na equipe hoje</div>
        </div>
        <div class="tc-handle" title="Arraste pra mudar de encarregado">⠿</div>
      </div>
      <div class="tc-select">
        <select onchange="reassignEmpresa('${empresaJs}', this.value)">${options}</select>
      </div>
    </div>
  `;
}

function initials(nome) {
  const parts = (nome || '').trim().split(/\s+/);
  const first = parts[0] ? parts[0][0] : '';
  const last = parts.length > 1 ? parts[parts.length - 1][0] : '';
  return (first + last).toUpperCase();
}

function avatarColor(nome) {
  const palette = ['#0053D8', '#2F9E44', '#E8590C', '#4ECDC4', '#585759', '#063593'];
  let hash = 0;
  for (let i = 0; i < (nome || '').length; i++) hash = (hash * 31 + nome.charCodeAt(i)) >>> 0;
  return palette[hash % palette.length];
}

function fotoUrl(f) {
  if (!f.foto_path || !sb) return null;
  const { data } = sb.storage.from(BUCKET).getPublicUrl(f.foto_path);
  const t = f.updated_at ? new Date(f.updated_at).getTime() : '';
  return data.publicUrl + (t ? ('?t=' + t) : '');
}

function avatarHtml(f) {
  return `<div class="tc-avatar" style="background:${avatarColor(f.nome)};">${initials(f.nome)}</div>`;
}

// mesma classificação por estrelas (★☆☆☆☆ até ★★★★★) que já existe na
// coluna "CLASSIFICAÇÃO" da planilha, sincronizada pela macro do Excel.
// Sem nota ainda (null) não mostra nada, pra não confundir com nota 0.
function estrelasHtml(f) {
  if (f.classificacao === null || f.classificacao === undefined) return '';
  const cheias = Math.max(0, Math.min(5, Number(f.classificacao)));
  const vazias = 5 - cheias;
  return `<div class="tc-estrelas" title="Classificação: ${cheias}/5">${'★'.repeat(cheias)}${'☆'.repeat(vazias)}</div>`;
}

// bolinha verde/vermelha no canto da foto: verde = presença marcada hoje,
// vermelha = falta marcada hoje. Sem registro ainda hoje = sem bolinha (pra
// não sugerir falta antes de alguém realmente bater o ponto).
function presencaDotHtml(funcionarioId) {
  const status = presencaHojeMap.get(String(funcionarioId));
  if (status === 'presente') return `<div class="tc-presenca-dot presente" title="Presente hoje"></div>`;
  if (status === 'falta') return `<div class="tc-presenca-dot falta" title="Falta hoje"></div>`;
  return '';
}

// chamada pelo onerror da <img> — separado em função pra não ter que embutir
// HTML com aspas duplas dentro de um atributo (dava conflito de aspas)
function avatarFallback(imgEl, nome) {
  imgEl.outerHTML = avatarHtml({ nome });
}

// abre a foto do card em tela cheia (toque na lupa)
function openLightbox(url, nome) {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightboxNome').textContent = nome || '';
  document.getElementById('photoLightbox').classList.add('show');
}
function closeLightbox(e) {
  if (e) e.stopPropagation();
  document.getElementById('photoLightbox').classList.remove('show');
  document.getElementById('lightboxImg').src = '';
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeLightbox(); fecharPerfil(); }
});

// ============================================================
// PERFIL DA PESSOA (toque no nome/info do card)
// ============================================================
let perfilFuncionarioId = null;

function abrirPerfil(funcionarioId) {
  const f = funcionarios.find(x => String(x.id) === String(funcionarioId));
  if (!f) return;
  perfilFuncionarioId = funcionarioId;

  const url = fotoUrl(f);
  document.getElementById('perfilFoto').innerHTML = url
    ? `<img src="${url}" alt="${f.nome}" onerror="avatarFallback(this, '${f.nome.replace(/'/g, "\\'")}')">`
    : avatarHtml(f);
  document.getElementById('perfilNome').textContent = f.nome;
  document.getElementById('perfilSub').textContent =
    `${f.funcao}${f.alocacao ? ' • ' + f.alocacao : ''} — ${f.empresa}`;

  const estrelasEl = document.getElementById('perfilEstrelas');
  if (f.classificacao === null || f.classificacao === undefined) {
    estrelasEl.innerHTML = `<span class="semnota">Ainda sem classificação</span>`;
  } else {
    const cheias = Math.max(0, Math.min(5, Number(f.classificacao)));
    estrelasEl.innerHTML = `<span class="valor">${'★'.repeat(cheias)}${'☆'.repeat(5 - cheias)}</span>`;
  }

  document.getElementById('perfilObsTexto').value = f.observacao || '';
  document.getElementById('perfilObsStatus').textContent = '';
  document.getElementById('perfilObsSalvarBtn').disabled = false;

  atualizarStatusCatraca(f);

  document.getElementById('perfilModal').classList.add('show');
}

// ------------------------------------------------------------
// Cadastro remoto na catraca — botão só marca
// funcionarios.catraca_cadastro_pendente = true; quem realmente fala com
// o equipamento é o catraca_servidor.js rodando no computador da entrada
// (ele fica de olho nessa marcação e cuida do resto sozinho). Ver
// LEIA-ME_catraca.md pra detalhes de como isso funciona.
// ------------------------------------------------------------
function atualizarStatusCatraca(f) {
  const status = document.getElementById('perfilCatracaStatus');
  const btn = document.getElementById('perfilCatracaBtn');

  if (f.matricula_catraca) {
    status.textContent = '✅ Já cadastrada e reconhecendo o rosto normalmente.';
    btn.textContent = '📷 Cadastrar de novo (atualizar rosto)';
    btn.disabled = false;
  } else if (f.catraca_cadastro_pendente) {
    status.textContent = '⏳ Aguardando: leve essa pessoa até a catraca e peça pra ela olhar pra câmera pra concluir.';
    btn.textContent = '📷 Cadastro já pedido';
    btn.disabled = true;
  } else {
    status.textContent = 'Ainda não cadastrada na catraca.';
    btn.textContent = '📷 Cadastrar na catraca';
    btn.disabled = false;
  }
}

async function cadastrarNaCatraca() {
  const funcionarioId = perfilFuncionarioId;
  if (!funcionarioId) return;
  if (!sb) { showToast('⚠️ Sem conexão.'); return; }

  const item = funcionarios.find(x => String(x.id) === String(funcionarioId));
  if (!item) return;

  const btn = document.getElementById('perfilCatracaBtn');
  btn.disabled = true;

  try {
    const { error } = await sb
      .from('funcionarios')
      .update({ catraca_cadastro_pendente: true })
      .eq('id', funcionarioId);
    if (error) throw error;
    item.catraca_cadastro_pendente = true;
    atualizarStatusCatraca(item);
    showToast('📷 Pedido enviado! Leve a pessoa até a catraca em alguns segundos e peça pra ela olhar pra câmera.');
    registrarEdicao('editar', `Pediu cadastro na catraca para ${item.nome}`);
  } catch (e) {
    showToast('⚠️ Erro ao pedir cadastro na catraca: ' + (e.message || e));
    btn.disabled = false;
  }
}

function fecharPerfil(e) {
  if (e) e.stopPropagation();
  document.getElementById('perfilModal').classList.remove('show');
  perfilFuncionarioId = null;
}

async function salvarObservacao() {
  const funcionarioId = perfilFuncionarioId;
  if (!funcionarioId) return;
  if (!sb) { showToast('⚠️ Sem conexão.'); return; }

  const texto = document.getElementById('perfilObsTexto').value;
  const btn = document.getElementById('perfilObsSalvarBtn');
  const status = document.getElementById('perfilObsStatus');
  btn.disabled = true;
  status.textContent = 'Salvando...';

  try {
    const { error } = await sb
      .from('funcionarios')
      .update({ observacao: texto || null })
      .eq('id', funcionarioId);
    if (error) throw error;
    const item = funcionarios.find(f => String(f.id) === String(funcionarioId));
    if (item) item.observacao = texto || null;
    status.textContent = 'Comentário salvo ✓';
    showToast('✅ Comentário salvo!');
    registrarEdicao('editar', `Salvou comentário sobre ${item ? item.nome : funcionarioId}`);
  } catch (e) {
    status.textContent = '';
    showToast('⚠️ Erro ao salvar comentário: ' + (e.message || e));
  } finally {
    btn.disabled = false;
  }
}

function cardHtml(f) {
  const url = fotoUrl(f);
  // se a foto falhar ao carregar (link quebrado, sem internet no momento), cai
  // pro avatar de iniciais em vez de mostrar o ícone de imagem quebrada
  const photoInner = url
    ? `<img src="${url}" alt="${f.nome}" onerror="avatarFallback(this, '${f.nome.replace(/'/g, "\\'")}')">`
    : avatarHtml(f);
  const nomeAttr = f.nome.replace(/'/g, "\\'");
  // lupa só aparece quando já existe foto de verdade (não faz sentido ampliar as iniciais)
  const zoomBtn = url
    ? `<div class="tc-zoom" onclick="event.stopPropagation(); openLightbox('${url}', '${nomeAttr}')" title="Ver foto ampliada">🔍</div>`
    : '';

  const options = [`<option value="" ${!f.encarregado ? 'selected' : ''}>Nenhum</option>`]
    .concat(EQUIPE_PROPRIA.map(e => `<option value="${e.id}" ${f.encarregado === e.id ? 'selected' : ''}>${e.label}</option>`))
    .join('');

  return `
    <div class="team-card" data-fid="${f.id}">
      <div class="tc-top">
        <div class="tc-photo" id="photo_${f.id}" onclick="triggerPhotoUpload('${f.id}')" title="Toque pra trocar a foto">
          ${photoInner}
          <div class="tc-photo-badge">📷</div>
          ${presencaDotHtml(f.id)}
          ${zoomBtn}
        </div>
        <div class="tc-info" onclick="abrirPerfil('${f.id}')">
          <div class="tc-nome">${f.nome}</div>
          <div class="tc-funcao">${f.funcao}${f.alocacao ? ' • ' + f.alocacao : ''}</div>
          <div class="tc-empresa">${f.empresa}</div>
          ${estrelasHtml(f)}
        </div>
        <div class="tc-handle" title="Arraste pra mudar de encarregado">⠿</div>
      </div>
      <div class="tc-select">
        <select onchange="reassign('${f.id}', this.value)">${options}</select>
      </div>
    </div>
  `;
}

// ============================================================
// REATRIBUIR ENCARREGADO
// ============================================================
async function reassign(funcionarioId, encarregado) {
  if (!sb) { showToast('⚠️ Sem conexão.'); render(); return; }
  try {
    const { error } = await sb
      .from('funcionarios')
      .update({ encarregado: encarregado || null })
      .eq('id', funcionarioId);
    if (error) throw error;
    const item = funcionarios.find(f => String(f.id) === String(funcionarioId));
    if (item) item.encarregado = encarregado || null;
    render();
    showToast('✅ Equipe atualizada!');
    const nomeDestino = encarregado ? (EQUIPE_PROPRIA.find(x => x.id === encarregado) || {}).label : 'Sem encarregado';
    registrarEdicao('editar', `Mudou ${item ? item.nome : funcionarioId} (seletor) para "${nomeDestino || encarregado}"`);
  } catch (e) {
    showToast('⚠️ Erro ao mudar de equipe: ' + (e.message || e));
    render();
  }
}

// ============================================================
// FOTO
// ============================================================
let photoTargetId = null;

function triggerPhotoUpload(funcionarioId) {
  photoTargetId = funcionarioId;
  document.getElementById('photoInput').value = '';
  document.getElementById('photoInput').click();
}

async function onPhotoSelected(event) {
  const file = event.target.files && event.target.files[0];
  const funcionarioId = photoTargetId;
  if (!file || !funcionarioId) return;

  if (!file.type.startsWith('image/')) {
    showToast('⚠️ Selecione um arquivo de imagem.');
    return;
  }
  if (!sb) { showToast('⚠️ Sem conexão.'); return; }

  const photoEl = document.getElementById('photo_' + funcionarioId);
  if (photoEl) photoEl.classList.add('uploading');
  showToast('📤 Enviando foto...');

  try {
    const blob = await fileToResizedJpeg(file, 400, 0.82);
    const path = `${funcionarioId}.jpg`;

    const { error: upErr } = await sb.storage.from(BUCKET).upload(path, blob, {
      upsert: true,
      contentType: 'image/jpeg',
    });
    if (upErr) throw upErr;

    const nowIso = new Date().toISOString();
    const { error: updErr } = await sb
      .from('funcionarios')
      .update({ foto_path: path, updated_at: nowIso })
      .eq('id', funcionarioId);
    if (updErr) throw updErr;

    const item = funcionarios.find(f => String(f.id) === String(funcionarioId));
    if (item) { item.foto_path = path; item.updated_at = nowIso; }
    render();
    showToast('✅ Foto atualizada!');
    registrarEdicao('editar', `Trocou a foto de ${item ? item.nome : funcionarioId}`);
  } catch (e) {
    showToast('⚠️ Erro ao enviar foto: ' + (e.message || e));
    console.error(e);
    if (photoEl) photoEl.classList.remove('uploading');
  }
}

// Redimensiona/comprime a foto no navegador antes de enviar, pra não subir
// fotos de celular gigantes pro Supabase Storage. Usa createImageBitmap com
// imageOrientation 'from-image' pra já corrigir a rotação de fotos de celular.
async function fileToResizedJpeg(file, maxSize, quality) {
  let bitmap;
  try {
    bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch (e) {
    bitmap = await createImageBitmap(file);
  }
  const scale = Math.min(1, maxSize / Math.max(bitmap.width, bitmap.height));
  const w = Math.max(1, Math.round(bitmap.width * scale));
  const h = Math.max(1, Math.round(bitmap.height * scale));
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bitmap, 0, 0, w, h);
  return new Promise((resolve, reject) => {
    canvas.toBlob(b => b ? resolve(b) : reject(new Error('Falha ao gerar imagem')), 'image/jpeg', quality);
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
